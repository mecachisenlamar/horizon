name: linux client (personal build)
# A personal build of this branch's game for Linux, to import with the launcher's
# "Import a game build". Runs only on pushes to linux-build or by hand.
on:
  push:
    branches: [linux-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust
        run: echo "version=$(cat tools/ci/rust-version)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: ${{ steps.rust.outputs.version }}
      - name: ALSA and udev headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Build
        run: cargo build --locked --release -p horizon-game --bin horizon-client -p horizon-prepare
      - name: Collect
        run: |
          mkdir -p out
          cp target/release/horizon-client target/release/horizon-prepare out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: horizon-linux-client
          path: out/
